# Nginx Reverse Proxy for PollTech Radar
# Place in: /etc/nginx/sites-available/radar
# Link to: /etc/nginx/sites-enabled/radar

server {
    listen 80;
    server_name radar.polltech.internal; # Change to your server domain or public IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name radar.polltech.internal; # Change to your server domain or public IP

    # SSL Certificate & Key paths (Let's Encrypt or corporate certs)
    ssl_certificate /etc/ssl/certs/radar.crt;
    ssl_certificate_key /etc/ssl/private/radar.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum file upload size (for reports, batch imports)
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and Streaming support (Critical for MCP and streaming responses)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
